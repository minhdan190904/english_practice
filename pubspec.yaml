name: english_practice
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  record: ^6.2.0
  path_provider: ^2.1.5

  go_router: ^14.8.1
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.0.17
  json_annotation: ^4.9.0
  freezed_annotation: 2.4.4
  get_it: ^8.0.3
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3
  dartz: ^0.10.1
  loading_animation_widget: ^1.3.0
  flutter_html: ^3.0.0
  google_mobile_ads: ^5.3.1
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  app_settings: ^5.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flash_card: ^0.1.0
  swipeable_page_route: ^0.4.7
  amplitude_flutter: ^4.2.0
  shared_preferences: ^2.5.2
  in_app_review: ^2.0.10
  firebase_core: ^3.12.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  firebase_crashlytics: ^4.3.4
  firebase_analytics: ^11.4.4
  smooth_page_indicator: ^1.2.1
  in_app_purchase: ^3.2.1
  lottie: ^3.3.1
  share_plus: ^10.1.4
  flutter_markdown: ^0.7.6+2
  percent_indicator: ^4.2.4
  equatable: ^2.0.7
  in_app_purchase_android: ^0.4.0+1
  just_audio: ^0.9.46

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: 2.4.12
  freezed: 2.4.7
  json_serializable: 6.8.0
  hive_generator: 2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/png/launcher.png"
  min_sdk_size: 21
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Black.otf
          weight: 900
        - asset: assets/fonts/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Light.otf
          weight: 300
        - asset: assets/fonts/SF-Pro-Display-Thin.otf
          weight: 200
        - asset: assets/fonts/SF-Pro-Display-Ultralight.otf
          weight: 100

  assets:
    - assets/
    - assets/png/
    - assets/svg/
    - assets/json/
    - assets/json/oxford_words/
    - assets/fonts/
    - assets/lottie/
    - assets/md/
    - assets/md/grammar/
    - assets/md/grammar/words/
    - assets/md/grammar/words/word__families/
    - assets/md/grammar/tenses/
    - assets/md/grammar/tenses/past/
    - assets/md/grammar/tenses/future/
    - assets/md/grammar/tenses/present/
    - assets/md/grammar/sentences/
    - assets/md/speaking/
    - assets/md/grammar_vi/
    - assets/md/grammar_vi/tenses/
    - assets/md/grammar_vi/tenses/past/
    - assets/md/grammar_vi/tenses/future/
    - assets/md/grammar_vi/tenses/present/
    - assets/md/grammar_vi/sentences/
    - assets/md/grammar_vi/words/
    - assets/md/grammar_vi/words/word__families/